<script>
    // --- 1. Helpers ---
    /**
     * Escapes every string in API data before it is rendered with innerHTML.
     */
    function escapeHtmlDeep(value) {
        if (typeof value === 'string') {
            return value.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }
        if (Array.isArray(value)) return value.map(escapeHtmlDeep);
        if (value && typeof value === 'object') {
            return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, escapeHtmlDeep(v)]));
        }
        return value;
    }

    // Admin GET with the token; a 401 sends the admin back to login
    async function adminGet(path) {
        const res = await fetch(`/api/${path}`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('smsglobe_admin_token')}` } });
        if (res.status === 401) { logout(); throw new Error('Session expired'); }
        return escapeHtmlDeep(await res.json());
    }

    const naira = amount => `₦${Math.round(Number(amount || 0)).toLocaleString()}`;
    const signedNaira = amount => `${amount < 0 ? '−' : '+'}${naira(Math.abs(amount))}`;

    // --- 2. Day Helpers (Lagos days as YYYY-MM-DD; noon UTC stops the browser shifting the day) ---
    const lagosToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
    const shiftDay = (ymd, n) => new Date(Date.parse(`${ymd}T12:00:00Z`) + n * 86400000).toISOString().slice(0, 10);

    // "2026-05-05" -> "5/5/26" (day/month/year, as Nigeria writes it)
    const shortDayLabel = ymd => {
        const [y, m, d] = ymd.split('-');
        return `${Number(d)}/${Number(m)}/${y.slice(2)}`;
    };
    const longDayLabel = ymd => new Date(`${ymd}T12:00:00Z`).toLocaleDateString('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'
    });

    /** "Today" / "Yesterday" / "Thu, 8 Oct" for the trend rows. */
    function trendDayLabel(ymd) {
        const today = lagosToday();
        if (ymd === today) return 'Today';
        if (ymd === shiftDay(today, -1)) return 'Yesterday';
        const sameYear = ymd.slice(0, 4) === today.slice(0, 4);
        return new Date(`${ymd}T12:00:00Z`).toLocaleDateString('en-GB', {
            weekday: 'short', day: 'numeric', month: 'short', ...(sameYear ? {} : { year: 'numeric' }), timeZone: 'UTC'
        });
    }

    /**
     * "+25%" against the other day, plus a tone. `invert` flips the tone where going up is bad (cost).
     */
    function dayDelta(cur, prev, { money = false, invert = false } = {}) {
        const c = Number(cur || 0);
        const p = Number(prev || 0);
        const diff = c - p;
        if (diff === 0) return { text: 'No change', tone: null };
        const sign = diff < 0 ? '−' : '+';
        // Nothing on the other day: a percentage is meaningless, so show the amount
        const text = p !== 0
            ? `${sign}${Math.abs((diff / Math.abs(p)) * 100).toFixed(0)}%`
            : `${sign}${money ? naira(Math.abs(diff)) : Math.abs(diff).toLocaleString()}`;
        const good = invert ? diff < 0 : diff > 0;
        return { text, tone: good ? 'up' : 'down' };
    }

    // --- 3. Cards (same look as the dashboard tiles, in a compact size) ---
    const TILE_ICONS = {
        wallet: 'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z',
        trend: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6',
        card: 'M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z',
        cart: 'M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z',
        chat: 'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z',
        users: 'M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z'
    };
    const TILE_TONES = {
        green: 'bg-green-50 text-green-600 border-green-100',
        blue: 'bg-blue-50 text-brand-blue border-blue-100',
        red: 'bg-red-50 text-red-500 border-red-100',
        orange: 'bg-orange-50 text-brand-orange border-orange-100'
    };
    const PILL_TONES = {
        up: 'bg-green-50 text-green-700 border-green-200',
        down: 'bg-red-50 text-red-600 border-red-200'
    };
    const NEUTRAL_PILL = 'bg-gray-50 text-brand-midText border-brand-border';
    const cardShell = accent => `h-full flex flex-col justify-between bg-white rounded-2xl border ${accent ? 'border-blue-200 shadow-md shadow-blue-900/5' : 'border-brand-border shadow-sm'} p-3 sm:p-5`;

    /** One day's figure, with the change pill when there is a day to compare with. */
    function statTile({ label, value, icon, tone, accent = false, pill = null, pillTone = null, pillTitle = '' }) {
        return `
            <div class="${cardShell(accent)}">
                <div class="flex items-start justify-between gap-2 sm:gap-3">
                    <div class="min-w-0 flex-1">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-brand-lightText leading-snug truncate">${label}</p>
                        <p class="text-base sm:text-2xl font-bold mt-1.5 sm:mt-2 tabular-nums break-words ${accent ? 'text-brand-blue' : 'text-brand-darkText'}">${value}</p>
                    </div>
                    <span class="hidden sm:flex w-10 h-10 rounded-full border items-center justify-center shrink-0 ${TILE_TONES[tone]}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${TILE_ICONS[icon]}"/></svg>
                    </span>
                </div>
                ${pill != null ? `
                <div class="mt-2 sm:mt-3 flex justify-end">
                    <span title="${pillTitle}" class="text-[11px] font-semibold px-2 py-0.5 rounded-md border tabular-nums ${PILL_TONES[pillTone] || NEUTRAL_PILL}">${pill}</span>
                </div>` : ''}
            </div>`;
    }

    /**
     * Compare-mode card: the viewed day (A) on top with the change beside its date,
     * the compare day (B) under the divider. Fixed rows keep neighbouring cards lined up.
     */
    function compareTile({ label, a, b, delta, accent = false }) {
        return `
            <div class="${cardShell(accent)}">
                <p class="text-[10px] font-bold uppercase tracking-widest text-brand-lightText truncate">${label}</p>
                <p class="mt-1.5 sm:mt-2 text-base sm:text-2xl font-bold tabular-nums truncate ${accent ? 'text-brand-blue' : 'text-brand-darkText'}">${a.value}</p>
                <div class="mt-0.5 flex items-center justify-between gap-2">
                    <span class="text-[10px] sm:text-xs text-brand-lightText tabular-nums">${shortDayLabel(a.date)}</span>
                    <span class="shrink-0 text-[10px] sm:text-[11px] font-semibold px-1.5 sm:px-2 py-0.5 rounded-md border tabular-nums ${PILL_TONES[delta.tone] || NEUTRAL_PILL}">${delta.text}</span>
                </div>
                <div class="mt-2 pt-2 border-t border-brand-border">
                    <p class="text-sm sm:text-base font-semibold tabular-nums text-brand-midText truncate">${b.value}</p>
                    <p class="text-[10px] sm:text-xs text-brand-lightText tabular-nums">${shortDayLabel(b.date)}</p>
                </div>
            </div>`;
    }

    // --- 4. State & Loading ---
    let viewDate = lagosToday();
    let rows = [];
    let loadError = '';
    let isLoading = false;
    let compareDate = ''; // '' = no compare day picked
    let compareRow = null;
    let loadToken = 0; // Ignores replies for a day the admin already left
    let compareToken = 0;

    async function loadDays() {
        const myToken = ++loadToken;
        isLoading = true;
        render();
        try {
            const data = await adminGet(`daily-stats?date=${viewDate}&days=14`);
            if (myToken !== loadToken) return;
            if (!data.success) throw new Error(data.message);
            rows = Array.isArray(data.rows) ? data.rows : [];
            loadError = '';
        } catch (err) {
            if (myToken !== loadToken) return;
            loadError = err.message || 'Failed to load daily stats.';
        }
        isLoading = false;
        render();
    }

    async function loadCompare() {
        const myToken = ++compareToken;
        compareRow = null;
        if (!compareDate) return render();
        render();
        try {
            const data = await adminGet(`daily-stats?date=${compareDate}&days=1`);
            if (myToken !== compareToken) return;
            const list = data.success && Array.isArray(data.rows) ? data.rows : [];
            compareRow = list.length ? list[list.length - 1] : null;
        } catch (err) {
            if (myToken !== compareToken) return;
            compareRow = null;
        }
        render();
    }

    function setDay(ymd) {
        const today = lagosToday();
        if (!ymd) return;
        viewDate = ymd > today ? today : ymd;
        loadDays();
    }

    function setCompare(ymd) {
        const today = lagosToday();
        compareDate = ymd && ymd > today ? today : (ymd || '');
        loadCompare();
    }

    // --- 5. Rendering ---
    function renderControls(prev) {
        const today = lagosToday();
        document.getElementById('daySubtitle').innerText = longDayLabel(viewDate)
            + (prev ? ` · compared with ${longDayLabel(prev.date)}` : compareDate ? ' · loading comparison...' : '');
        document.getElementById('dayLabel').innerText = shortDayLabel(viewDate);
        const dayInput = document.getElementById('dayInput');
        dayInput.value = viewDate;
        dayInput.max = today;
        document.getElementById('nextDayBtn').disabled = viewDate >= today;

        const compareInput = document.getElementById('compareInput');
        compareInput.value = compareDate;
        compareInput.max = today;
        document.getElementById('compareLabel').innerText = compareDate ? shortDayLabel(compareDate) : 'Compare';
        document.getElementById('compareBox').className = `relative shrink-0 inline-flex items-center rounded-xl border px-3 py-2 text-sm font-bold cursor-pointer tabular-nums transition-colors ${
            compareDate ? 'bg-blue-50 border-blue-200 text-brand-blue' : 'bg-white border-brand-border text-brand-midText hover:bg-brand-background hover:text-brand-blue'
        }`;
        document.getElementById('clearCompareBtn').classList.toggle('hidden', !compareDate);
        document.getElementById('refreshIcon').classList.toggle('animate-spin', isLoading);
    }

    function render() {
        const today = lagosToday();
        const body = document.getElementById('dailyBody');
        const day = rows.length ? rows[rows.length - 1] : null;
        const dayBefore = rows.length > 1 ? rows[rows.length - 2] : null;
        // What the pills compare against: the picked day, else yesterday when viewing today
        const prev = compareDate ? (compareRow?.date === compareDate ? compareRow : null) : (viewDate === today ? dayBefore : null);
        renderControls(prev);

        if (loadError) {
            body.innerHTML = `
                <div class="mt-6 text-red-600 text-sm bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-center justify-between gap-3">
                    <span>${loadError}</span>
                    <button type="button" onclick="loadDays()" class="px-3 py-1 border border-red-200 rounded-lg text-xs font-bold hover:bg-white">Retry</button>
                </div>`;
            return;
        }
        if (!day) {
            body.innerHTML = '<p class="text-xs text-brand-lightText animate-pulse mt-6">Loading daily stats...</p>';
            return;
        }
        body.classList.toggle('opacity-60', isLoading || day.date !== viewDate);

        const sum = (r, key) => r ? Number(r.numbers[key] || 0) + Number(r.accounts[key] || 0) : 0;
        const card = (label, cur, before, { money = false, invert = false, signed = false, icon, tone, accent = false } = {}) => {
            const delta = dayDelta(cur, before, { money, invert });
            const fmt = value => {
                const n = Number(value || 0);
                if (signed) return signedNaira(n);
                return money ? naira(n) : n.toLocaleString();
            };
            if (compareDate && prev) {
                return compareTile({ label, accent, a: { date: day.date, value: fmt(cur) }, b: { date: prev.date, value: fmt(before) }, delta });
            }
            return statTile({
                label, value: fmt(cur), icon, tone, accent,
                pill: prev ? delta.text : null,
                pillTone: delta.tone,
                pillTitle: prev ? `vs ${longDayLabel(prev.date)}: ${fmt(before)}` : ''
            });
        };
        const section = (title, cards) => `
            <div class="mt-6 sm:mt-8">
                <h3 class="text-[11px] font-bold uppercase tracking-widest text-brand-midText mb-3">${title}</h3>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">${cards.join('')}</div>
            </div>`;

        // The first row only exists to give the oldest visible day its comparison
        const trend = rows.slice(1).reverse();
        const netClass = net => net < 0 ? 'text-red-600' : net > 0 ? 'text-green-700' : '';
        const td = 'px-4 py-3 text-right tabular-nums whitespace-nowrap';

        body.innerHTML = [
            section('Total (numbers + social &amp; VPN)', [
                card('Revenue', sum(day, 'revenue'), sum(prev, 'revenue'), { money: true, icon: 'wallet', tone: 'green', accent: true }),
                card('Profit', sum(day, 'profit'), sum(prev, 'profit'), { money: true, icon: 'trend', tone: 'blue', accent: true }),
                card('Cost', sum(day, 'cost'), sum(prev, 'cost'), { money: true, invert: true, icon: 'card', tone: 'red' }),
                card('Orders', sum(day, 'orders'), sum(prev, 'orders'), { icon: 'cart', tone: 'blue' })
            ]),
            section('Numbers', [
                card('Numbers revenue', day.numbers.revenue, prev?.numbers.revenue, { money: true, icon: 'wallet', tone: 'green' }),
                card('Numbers profit', day.numbers.profit, prev?.numbers.profit, { money: true, icon: 'trend', tone: 'blue' }),
                card('Numbers cost', day.numbers.cost, prev?.numbers.cost, { money: true, invert: true, icon: 'card', tone: 'red' }),
                card('Received OTPs', day.numbers.received, prev?.numbers.received, { icon: 'chat', tone: 'green' })
            ]),
            section('Social &amp; VPN', [
                card('Social &amp; VPN revenue', day.accounts.revenue, prev?.accounts.revenue, { money: true, icon: 'wallet', tone: 'green' }),
                card('Social &amp; VPN profit', day.accounts.profit, prev?.accounts.profit, { money: true, icon: 'trend', tone: 'blue' }),
                card('Social &amp; VPN cost', day.accounts.cost, prev?.accounts.cost, { money: true, invert: true, icon: 'card', tone: 'red' }),
                card('Social &amp; VPN orders', day.accounts.orders, prev?.accounts.orders, { icon: 'cart', tone: 'blue' })
            ]),
            section('Platform', [
                card('New users', day.newUsers, prev?.newUsers, { icon: 'users', tone: 'blue' }),
                card('Deposits', day.balance.deposits, prev?.balance.deposits, { money: true, icon: 'card', tone: 'green' }),
                card('Spent by users', day.balance.spent, prev?.balance.spent, { money: true, icon: 'cart', tone: 'orange' }),
                card('User balance', day.balance.net, prev?.balance.net, { money: true, signed: true, icon: 'wallet', tone: 'orange' })
            ]),
            `
            <div class="mt-8 sm:mt-10">
                <h3 class="font-bold text-lg text-brand-darkText mb-3 sm:mb-4">Last 14 days</h3>

                <!-- Mobile: card list -->
                <ul class="md:hidden space-y-3">
                    ${trend.map(r => `
                    <li>
                        <button type="button" onclick="setDay('${r.date}')" class="w-full text-left rounded-xl border p-3.5 transition-colors ${r.date === viewDate ? 'bg-blue-50 border-blue-200' : 'bg-white border-brand-border hover:bg-gray-50'}">
                            <div class="flex items-center justify-between gap-2">
                                <span class="font-bold text-sm">${trendDayLabel(r.date)}</span>
                                <span class="text-green-700 text-sm font-bold tabular-nums">${naira(sum(r, 'profit'))}</span>
                            </div>
                            <dl class="mt-2 grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs tabular-nums">
                                <div><dt class="text-brand-lightText">New users</dt><dd class="mt-0.5 font-semibold">${Number(r.newUsers).toLocaleString()}</dd></div>
                                <div><dt class="text-brand-lightText">Deposits</dt><dd class="mt-0.5 font-semibold">${naira(r.balance.deposits)}</dd></div>
                                <div><dt class="text-brand-lightText">Orders</dt><dd class="mt-0.5 font-semibold">${sum(r, 'orders').toLocaleString()}</dd></div>
                                <div><dt class="text-brand-lightText">Received OTPs</dt><dd class="mt-0.5 font-semibold">${Number(r.numbers.received).toLocaleString()}</dd></div>
                                <div><dt class="text-brand-lightText">Revenue</dt><dd class="mt-0.5 font-semibold">${naira(sum(r, 'revenue'))}</dd></div>
                                <div><dt class="text-brand-lightText">User balance</dt><dd class="mt-0.5 font-semibold ${netClass(r.balance.net)}">${signedNaira(r.balance.net)}</dd></div>
                            </dl>
                        </button>
                    </li>`).join('')}
                </ul>

                <!-- Tablet/desktop: table -->
                <div class="hidden md:block bg-white rounded-2xl border border-brand-border shadow-sm overflow-x-auto">
                    <table class="min-w-full text-xs">
                        <thead class="bg-gray-50 text-brand-lightText uppercase border-b border-brand-border">
                            <tr>
                                <th class="px-4 py-3 font-bold text-left">Day</th>
                                <th class="px-4 py-3 font-bold text-right">New users</th>
                                <th class="px-4 py-3 font-bold text-right">Deposits</th>
                                <th class="px-4 py-3 font-bold text-right">Orders</th>
                                <th class="px-4 py-3 font-bold text-right">Received OTPs</th>
                                <th class="px-4 py-3 font-bold text-right">Revenue</th>
                                <th class="px-4 py-3 font-bold text-right">Profit</th>
                                <th class="px-4 py-3 font-bold text-right">User balance</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-brand-border">
                            ${trend.map(r => `
                            <tr onclick="setDay('${r.date}')" class="cursor-pointer transition-colors ${r.date === viewDate ? 'bg-blue-50' : 'hover:bg-gray-50'}">
                                <td class="px-4 py-3 whitespace-nowrap font-semibold">${trendDayLabel(r.date)}</td>
                                <td class="${td}">${Number(r.newUsers).toLocaleString()}</td>
                                <td class="${td}">${naira(r.balance.deposits)}</td>
                                <td class="${td}">${sum(r, 'orders').toLocaleString()}</td>
                                <td class="${td}">${Number(r.numbers.received).toLocaleString()}</td>
                                <td class="${td}">${naira(sum(r, 'revenue'))}</td>
                                <td class="${td} text-green-700 font-semibold">${naira(sum(r, 'profit'))}</td>
                                <td class="${td} font-semibold ${netClass(r.balance.net)}">${signedNaira(r.balance.net)}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <p class="text-[11px] text-brand-lightText mt-3">Days follow Lagos time. Profit and cost cover orders that recorded the supplier's cost. User balance is deposits plus referral bonuses, minus what users spent (net of refunds).</p>
            </div>`
        ].join('');
    }

    // --- 6. Date Pickers (tapping the label opens the native picker where supported) ---
    ['dayInput', 'compareInput'].forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('click', () => { try { input.showPicker?.(); } catch (err) { /* Not supported */ } });
    });
    document.getElementById('dayInput').addEventListener('change', e => setDay(e.target.value));
    document.getElementById('compareInput').addEventListener('change', e => setCompare(e.target.value));

    function logout() {
        localStorage.removeItem('smsglobe_admin_token');
        window.location.href = '/admin/login';
    }

    /**
     * Toggles the mobile sidebar and its overlay
     */
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
        document.getElementById('sidebar-overlay').classList.toggle('hidden');
    }

    // --- 7. Startup ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('smsglobe_admin_token')) return;
        loadDays();
    });
</script>
</body>
</html>
