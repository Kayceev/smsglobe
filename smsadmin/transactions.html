<script>
    // --- 1. Helpers ---
    function escapeHtmlDeep(value) {
        if (typeof value === 'string') {
            return value.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }
        if (Array.isArray(value)) return value.map(escapeHtmlDeep);
        if (value && typeof value === 'object') {
            return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, escapeHtmlDeep(v)]));
        }
        return value;
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }

    function logout() { localStorage.removeItem('smsglobe_admin_token'); window.location.href = '/admin/login'; }

    // Every call carries the admin token; a 401 sends the admin back to login
    async function api(path) {
        const res = await fetch(`/api/${path}`, {
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('smsglobe_admin_token')}` }
        });
        if (res.status === 401) { logout(); throw new Error('Session expired'); }
        return escapeHtmlDeep(await res.json());
    }

    const naira = amount => amount == null ? '—' : `₦${Math.round(Number(amount)).toLocaleString()}`;
    const usd = amount => amount == null ? '—' : `$${Number(amount)}`; // Exactly as SMSBower sends it, no rounding
    const th = (label, right) => `<th class="px-5 py-3 text-[10px] md:text-[11px] font-bold uppercase tracking-wider text-brand-lightText${right ? ' text-right' : ''}">${label}</th>`;
    const badge = (text, cls) => `<span class="px-2.5 py-1 rounded-full font-bold text-[10px] uppercase ${cls}">${text}</span>`;
    const userCell = r => `<td class="px-5 py-3"><span class="font-semibold">${r.fullName || ''}</span><span class="block text-xs text-brand-lightText">${r.userEmail}</span></td>`;
    const dateCell = r => `<td class="px-5 py-3 text-xs text-brand-lightText">${new Date(r.createdAt).toLocaleString()}</td>`;
    const marginCell = (sell, cost) => {
        const margin = cost != null ? Number(sell) - Number(cost) : null;
        return `<td class="px-5 py-3 text-right tabular-nums font-semibold ${margin == null ? 'text-brand-lightText' : (margin < 0 ? 'text-red-600' : 'text-green-700')}">${margin == null ? '—' : naira(margin)}</td>`;
    };

    const STATUS_BADGES = {
        pending: 'bg-amber-50 text-amber-700',
        completed: 'bg-green-100 text-green-700',
        successful: 'bg-green-100 text-green-700',
        cancelled: 'bg-gray-100 text-gray-500',
        failed: 'bg-red-50 text-red-600'
    };
    const METHOD_LABELS = {
        admin_credit: 'Admin credit', card: 'Card', bank_transfer: 'Bank transfer', account: 'Bank account',
        ussd: 'USSD', mobilemoneygh: 'Mobile money', opay: 'OPay', applepay: 'Apple Pay', googlepay: 'Google Pay'
    };

    // --- 2. Tab Definitions (endpoint, filters, columns and row layout per tab) ---
    const TABS = {
        sms: {
            title: 'Number orders',
            note: 'Cost is what SMSBower charged. Profit counts received numbers only. Orders before cost tracking show “—”.',
            endpoint: 'admin-sms-orders',
            listKey: 'orders',
            search: 'Email, number or service',
            statuses: [['', 'All statuses'], ['pending', 'Pending'], ['completed', 'Completed'], ['cancelled', 'Cancelled'], ['failed', 'Failed']],
            columns: [['Date'], ['User'], ['Number'], ['Cost', true], ['Profit', true], ['OTP'], ['Status']],
            empty: 'No number orders found.',
            unit: 'orders',
            row: o => `
                <tr class="hover:bg-brand-background/30 transition-colors">
                    ${dateCell(o)}
                    ${userCell(o)}
                    <td class="px-5 py-3">
                        <span class="font-semibold">${o.serviceName}</span> <span class="text-xs text-brand-lightText">· ${o.countryName || 'Country ' + (o.countryId || '?')}</span>
                        <span class="block font-mono text-xs">${o.number ? '+' + String(o.number).replace(/^\+/, '') : '—'}</span>
                    </td>
                    <td class="px-5 py-3 text-right tabular-nums">${naira(o.costNGN)}${o.costUsd != null ? `<span class="block text-[9px] leading-tight text-brand-lightText">${usd(o.costUsd)}</span>` : ''}</td>
                    ${o.status === 'completed' ? marginCell(o.sellNGN, o.costNGN) : '<td class="px-5 py-3 text-right text-brand-lightText">—</td>'}
                    <td class="px-5 py-3 font-mono text-sm font-bold ${o.smsCode ? 'text-green-700' : 'text-brand-lightText font-normal'}">${o.smsCode || '—'}</td>
                    <td class="px-5 py-3">${badge(o.status, STATUS_BADGES[o.status] || 'bg-gray-100 text-gray-500')}${o.refunded ? '<span class="block text-[10px] text-brand-lightText mt-1">Refunded</span>' : ''}</td>
                </tr>`
        },
        accounts: {
            title: 'Accounts & VPN orders',
            note: "Bought live from Sameeha's Socialhub. Cost is what Sameeha charged.",
            endpoint: 'admin-account-orders',
            listKey: 'orders',
            search: 'Email, product or reference',
            statuses: [['', 'All orders'], ['delivered', 'Delivered'], ['refunded', 'Refunded']],
            columns: [['Date'], ['User'], ['Product'], ['Qty', true], ['Cost', true], ['Sold', true], ['Margin', true], ['Status']],
            empty: 'No Accounts & VPN orders found.',
            unit: 'orders',
            row: o => `
                <tr class="hover:bg-brand-background/30 transition-colors">
                    ${dateCell(o)}
                    ${userCell(o)}
                    <td class="px-5 py-3">
                        <span class="font-semibold">${o.productName}</span>${o.categoryName ? ` <span class="text-xs text-brand-lightText">· ${o.categoryName}</span>` : ''}
                        <span class="block font-mono text-[10px] text-brand-lightText">${o.reference || ''}${o.vendorOrderId ? ` · Sameeha #${o.vendorOrderId}` : ''}</span>
                    </td>
                    <td class="px-5 py-3 text-right tabular-nums">${o.quantity}</td>
                    <td class="px-5 py-3 text-right tabular-nums">${naira(o.costNGN)}</td>
                    <td class="px-5 py-3 text-right tabular-nums font-semibold">${naira(o.sellNGN)}</td>
                    ${o.refunded ? '<td class="px-5 py-3 text-right text-brand-lightText">—</td>' : marginCell(o.sellNGN, o.costNGN)}
                    <td class="px-5 py-3">${o.refunded ? badge('Refunded', 'bg-gray-100 text-gray-500') : badge('Delivered', 'bg-green-100 text-green-700')}</td>
                </tr>`
        },
        deposits: {
            title: 'Wallet deposits',
            note: 'Bank transfer top-ups (NeuraPay; older ones Flutterwave) and admin credits. Credited is what reached the wallet; the rest of the charge is the top-up fee.',
            endpoint: 'admin-deposits',
            listKey: 'deposits',
            search: 'Email, name or reference',
            statuses: [['', 'All statuses'], ['successful', 'Successful'], ['pending', 'Pending'], ['failed', 'Failed']],
            columns: [['Date'], ['User'], ['Method'], ['Reference'], ['Paid', true], ['Credited', true], ['Balance after', true], ['Status']],
            empty: 'No deposits found.',
            unit: 'deposits',
            row: d => `
                <tr class="hover:bg-brand-background/30 transition-colors">
                    ${dateCell(d)}
                    ${userCell(d)}
                    <td class="px-5 py-3">
                        <span class="font-semibold">${METHOD_LABELS[d.method] || d.method.replace(/_/g, ' ')}</span>
                        ${d.adminEmail ? `<span class="block text-[10px] text-brand-lightText">by ${d.adminEmail}${d.note ? ` · ${d.note}` : ''}</span>` : ''}
                    </td>
                    <td class="px-5 py-3 font-mono text-[11px] text-brand-lightText">${d.reference}</td>
                    <td class="px-5 py-3 text-right tabular-nums">${naira(d.chargedNGN)}${d.feeNGN ? `<span class="block text-[10px] text-brand-lightText">fee ${naira(d.feeNGN)}</span>` : ''}</td>
                    <td class="px-5 py-3 text-right tabular-nums font-semibold ${d.status === 'successful' ? 'text-green-700' : 'text-brand-lightText'}">${naira(d.amountNGN)}</td>
                    <td class="px-5 py-3 text-right tabular-nums">${naira(d.balanceAfter)}</td>
                    <td class="px-5 py-3">${badge(d.status, STATUS_BADGES[d.status] || 'bg-gray-100 text-gray-500')}</td>
                </tr>`
        }
    };

    // --- 3. Tab State & Loading ---
    let activeTab = 'sms';
    let page = 1;
    let pages = 1;
    let loadToken = 0; // Ignores replies from a tab the admin already left

    function switchTab(tab) {
        if (!TABS[tab]) tab = 'sms';
        activeTab = tab;
        page = 1;
        history.replaceState(null, '', `#${tab}`);

        const def = TABS[tab];
        document.querySelectorAll('.tab-btn').forEach(btn => {
            const on = btn.dataset.tab === tab;
            btn.classList.toggle('bg-brand-blue', on);
            btn.classList.toggle('text-white', on);
            btn.classList.toggle('shadow-sm', on);
            btn.classList.toggle('text-brand-lightText', !on);
            btn.classList.toggle('hover:text-brand-blue', !on);
        });
        document.getElementById('tabTitle').innerText = def.title;
        document.getElementById('tabNote').innerText = def.note;
        document.getElementById('txnSearch').value = '';
        document.getElementById('txnSearch').placeholder = def.search;
        document.getElementById('txnStatus').innerHTML = def.statuses.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
        document.getElementById('txnHead').innerHTML = `<tr>${def.columns.map(([label, right]) => th(label, right)).join('')}</tr>`;
        loadRows();
    }

    async function loadRows() {
        const def = TABS[activeTab];
        const myToken = ++loadToken;
        const tbody = document.getElementById('txnBody');
        const colspan = def.columns.length;
        const params = new URLSearchParams({ page, limit: 20 });
        const status = document.getElementById('txnStatus').value;
        const search = document.getElementById('txnSearch').value.trim();
        if (status) params.set('status', status);
        if (search) params.set('search', search);

        tbody.innerHTML = `<tr><td colspan="${colspan}" class="px-6 py-8 text-center text-brand-lightText">Loading...</td></tr>`;
        document.getElementById('txnInfo').innerText = '';

        try {
            const data = await api(`${def.endpoint}?${params}`);
            if (myToken !== loadToken) return;
            if (!data.success) throw new Error(data.message);
            pages = data.pages;
            const list = data[def.listKey] || [];
            tbody.innerHTML = list.length
                ? list.map(def.row).join('')
                : `<tr><td colspan="${colspan}" class="px-6 py-8 text-center text-brand-lightText">${def.empty}</td></tr>`;

            let info = `${Number(data.total).toLocaleString()} ${def.unit} · page ${data.page} of ${data.pages}`;
            if (activeTab === 'deposits') info += ` · ${naira(data.successfulNGN)} credited from ${Number(data.successfulCount).toLocaleString()} successful`;
            document.getElementById('txnInfo').innerText = info;
            document.getElementById('prevPage').disabled = data.page <= 1;
            document.getElementById('nextPage').disabled = data.page >= data.pages;
        } catch (err) {
            if (myToken !== loadToken) return;
            tbody.innerHTML = `<tr><td colspan="${colspan}" class="px-6 py-8 text-center text-red-500">Error connecting to API.</td></tr>`;
        }
    }

    window.changePage = function(step) {
        page = Math.min(Math.max(page + step, 1), pages);
        loadRows();
    };

    let searchTimer;
    document.getElementById('txnSearch').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { page = 1; loadRows(); }, 400);
    });
    document.getElementById('txnStatus').addEventListener('change', () => { page = 1; loadRows(); });

    // --- 4. Startup (the URL hash keeps the tab across reloads, e.g. /admin/transactions#deposits) ---
    window.onload = () => switchTab(location.hash.slice(1) || 'sms');
</script>
</body>
</html>
