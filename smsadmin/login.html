<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deemax Admin - Login</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="/assets/dark.css?v=16">
    <script src="/assets/theme.js?v=12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0F54C6',
                            orange: '#F9861E',
                            darkText: '#101828',
                            midText: '#344054',
                            lightText: '#667085',
                            background: '#F0F5FE',
                            border: '#EAECF0',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F0F5FE; }
        .logo-img { height: 36px; width: auto; object-fit: contain; }
        @media (min-width: 768px) { .logo-img { height: 44px; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans">

    <div class="w-full max-w-[400px]">
        <div class="flex flex-col items-center mb-6 sm:mb-8">
            <a href="/admin/dashboard">
                <img src="/assets/logo.png" alt="Deemax Logo" class="logo-img mb-3 sm:mb-4">
            </a>
            <h1 class="text-xl sm:text-2xl font-bold text-brand-darkText">Admin Login</h1>
            <p class="text-[13px] sm:text-sm text-brand-lightText mt-1 sm:mt-2 text-center">Secure access for Deemax administrators.</p>
        </div>

        <div class="bg-white p-6 sm:p-8 rounded-[20px] sm:rounded-[24px] border border-brand-border shadow-xl shadow-blue-100/50">
          <form id="loginForm" class="space-y-4 sm:space-y-5">
    <div>
        <label class="block text-[12px] sm:text-sm font-semibold text-brand-darkText mb-1.5">Email Address</label>
        <input type="email" id="email" placeholder="admin@smsglobe.com" 
            class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-brand-border focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue outline-none transition-all placeholder:text-brand-lightText/60 text-[13px] sm:text-sm" required>
    </div>

    <div>
        <div class="flex justify-between items-center mb-1.5">
            <label class="block text-[12px] sm:text-sm font-semibold text-brand-darkText">Password</label>
            <a href="/admin/forgot-password" class="text-[11px] sm:text-xs font-bold text-brand-blue hover:underline">Forgot?</a>
        </div>
        <div class="relative">
            <input id="password" type="password" placeholder="••••••••" 
                class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-brand-border focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue outline-none transition-all placeholder:text-brand-lightText/60 text-[13px] sm:text-sm" required>
            
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-lightText hover:text-brand-blue transition-colors p-1">
                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path id="eye-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path id="eye-outer-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>
        </div>
    </div>

    <button type="submit" id="submitBtn" class="w-full bg-brand-darkText text-white py-3 sm:py-3.5 rounded-xl text-[14px] sm:text-sm font-bold hover:bg-black transition-all shadow-lg mt-2 flex justify-center items-center gap-2 active:scale-[0.98]">
        <span>Sign in to Dashboard</span>
    </button>


    <!-- Demo Login (Localhost only, shown when DEMO_LOGIN_ENABLED=true) -->
    <div id="demoLoginGroup" class="hidden grid grid-cols-2 gap-3">
        <button type="button" onclick="handleDemoLogin(this, 'admin')" class="w-full border border-dashed border-brand-darkText text-brand-darkText bg-gray-50 py-3 sm:py-3.5 rounded-xl text-[13px] sm:text-sm font-bold hover:bg-gray-100 transition-all">
            <span>Demo Admin</span>
        </button>
        <button type="button" onclick="handleDemoLogin(this, 'user')" class="w-full border border-dashed border-brand-orange text-brand-orange bg-orange-50 py-3 sm:py-3.5 rounded-xl text-[13px] sm:text-sm font-bold hover:bg-orange-100 transition-all">
            <span>Demo User</span>
        </button>
        <p class="col-span-2 text-center text-[10px] font-bold text-brand-lightText uppercase tracking-widest">Localhost demo login</p>
    </div>

    <div class="relative py-3 sm:py-4 flex items-center">
        <div class="flex-grow border-t border-brand-border"></div>
        <span class="flex-shrink mx-4 text-[10px] sm:text-xs font-medium text-brand-lightText uppercase tracking-widest">Or Google Access</span>
        <div class="flex-grow border-t border-brand-border"></div>
    </div>

    <div id="g_id_onload"
        data-client_id="200301370065-fl80h2idsgants6kb6jcuaivkonljs6u.apps.googleusercontent.com"
        data-context="signin"
        data-ux_mode="popup"
        data-callback="handleGoogleResponse"
        data-auto_prompt="false">
    </div>

    <div class="gsi-skin">
        <!-- Dark mode face: Google draws its own button light when it personalises it ("Continue as ..."),
             so dark.css shows this instead and keeps Google's real button, invisible, on top to take the click -->
        <div class="gsi-face" aria-hidden="true"><svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Sign in with Google</span></div>
        <div id="googleBtn" class="g_id_signin w-full flex justify-center"
            data-type="standard"
            data-shape="rectangular"
            data-theme="outline"
            data-text="signin_with"
            data-size="large"
            data-logo_alignment="left">
        </div>
    </div>
    <script>
        // Match the Google button to the form width (Google caps it at 400px)
        (function () {
            const btn = document.getElementById('googleBtn');
            btn.dataset.width = Math.min(400, Math.floor(btn.parentElement.parentElement.clientWidth)) || 320;
        })();
    </script>
</form>
        </div>

        <p class="mt-6 sm:mt-8 text-center text-[10px] sm:text-xs text-brand-lightText">
            © 2026 Deemax. This is a protected administrative area.
        </p>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            // Icon Paths
            const eyeOpen = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
            const eyeClosed = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88L4.573 4.574m14.853 14.853L14.12 14.12M21.543 12A9.981 9.981 0 0012 5c-1.838 0-3.535.494-4.99 1.357" />
            `;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = eyeClosed;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = eyeOpen;
            }
        }

        async function handleGoogleResponse(response) {
            try {
                const res = await fetch('/api/google-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: response.credential, loginType: 'admin' })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('smsglobe_admin_token', data.token);
                    window.location.href = '/admin/dashboard';
                } else {
                    alert("Admin Access Denied: " + (data.message || "Unauthorized account"));
                }
            } catch (err) {
                alert("Server error during admin authentication.");
            }
        }

        // --- Demo Login (Localhost Only) ---
        async function checkDemoLogin() {
            try {
                const res = await fetch('/api/demo-login-status');
                const data = await res.json();
                if (data.enabled) {
                    document.getElementById('demoLoginGroup').classList.remove('hidden');
                }
            } catch (err) {
                // Demo login unavailable; keep the buttons hidden
            }
        }

        async function handleDemoLogin(btn, accountType) {
            const label = btn.querySelector('span');
            const originalText = label.innerText;
            btn.disabled = true;
            label.innerText = "Signing in...";

            try {
                const res = await fetch('/api/demo-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accountType })
                });
                const data = await res.json();

                if (!data.success) {
                    alert(data.message || "Demo login failed.");
                } else if (accountType === 'admin') {
                    localStorage.setItem('smsglobe_admin_token', data.token);
                    window.location.href = '/admin/dashboard';
                } else {
                    localStorage.setItem('userToken', data.token);
                    if (data.user) {
                        localStorage.setItem('userData', JSON.stringify(data.user));
                    }
                    window.location.href = '/dashboard';
                }
            } catch (err) {
                alert("Connection failed.");
            } finally {
                btn.disabled = false;
                label.innerText = originalText;
            }
        }

        checkDemoLogin();

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.querySelector('span').innerText = "Verifying Admin...";

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('smsglobe_admin_token', data.token);
                    window.location.href = '/admin/dashboard';
                } else {
                    alert(data.message || 'Access Denied.');
                    submitBtn.disabled = false;
                    submitBtn.querySelector('span').innerText = "Sign in to Dashboard";
                }
            } catch (error) {
                alert('Connection failed.');
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = "Sign in to Dashboard";
            }
        });
    </script>
</body>
</html>
