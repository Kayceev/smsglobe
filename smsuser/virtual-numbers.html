async function safeFetch(url, options = {}) {
    const token = localStorage.getItem('userToken');
    const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...(options.headers || {})
    };

    const res = await fetch(url, {
        ...options,
        headers
    });

    const contentType = res.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) {
        throw new Error("Server returned a non-JSON response or invalid content-type.");
    }
    const data = await res.json();
    return { res, data };
}

async function fetchUserProfile() {
    const token = localStorage.getItem('userToken');
    if (!token) return;

    try {
        const { res, data } = await safeFetch(`${API_BASE_URL}/user-profile`, {
            headers: { 'Cache-Control': 'no-cache' }
        });

        if (res.status === 401) return logout();

        if (res.status === 403 && data.isUnverified) {
            window.location.href = `/register?verify_email=${encodeURIComponent(data.email || '')}`;
            return;
        }

        if (data.success) {
            const userData = data.user || data;
            userBalance = parseFloat(userData.balance || 0); // Used by the buy confirmation
            renderHeaderBalance();
            localStorage.setItem('dashboard_cache', JSON.stringify({ user: userData }));
            localStorage.setItem('user_balance', userBalance);
        }
    } catch (err) {
        console.error("Failed to fetch profile details:", err);
    }
}

function getServiceIconUrl(serviceCode, serviceName) {
    const cleanCode = String(serviceCode || '').toLowerCase().trim();
    if (typeof PRIORITY_ICONS !== 'undefined' && PRIORITY_ICONS[cleanCode]) {
        return PRIORITY_ICONS[cleanCode];
    }
    return `${API_BASE_URL}/service-image?id=${cleanCode}`;
}

function prioritizeServices(services) {
    if (!Array.isArray(services)) return [];

    return [...services].sort((a, b) => {
        const codeA = String(a.code || a.id || '').toLowerCase().trim();
        const nameA = String(a.name || a.serviceName || '').toLowerCase().trim();

        const codeB = String(b.code || b.id || '').toLowerCase().trim();
        const nameB = String(b.name || b.serviceName || '').toLowerCase().trim();

        const getPriorityScore = (code, name) => {
            // Split name into words to prevent partial substring false positives (e.g., "wa" in "rewards")
            const nameWords = name.split(/[\s-_]+/);

            for (let i = 0; i < POPULAR_SERVICE_KEYWORDS.length; i++) {
                const group = POPULAR_SERVICE_KEYWORDS[i];
                
                // Match exact code, exact word in name, or full keyword if it's long enough (> 3 chars)
                const isMatch = group.keys.some(k => {
                    return code === k || 
                           nameWords.includes(k) || 
                           (k.length > 3 && name.includes(k));
                });

                if (isMatch) {
                    return i; // Returns index 0 through 9 for top services
                }
            }
            return 999; // Non-priority items go to the bottom
        };

        const scoreA = getPriorityScore(codeA, nameA);
        const scoreB = getPriorityScore(codeB, nameB);

        if (scoreA !== scoreB) {
            return scoreA - scoreB;
        }

        // Secondary alphabetical sort for tied scores
        return nameA.localeCompare(nameB);
    });
}

function getCountryFlagCode(countryData) {
    if (!countryData) return 'un';
    const directCode = String(countryData.code || countryData.countryCode || countryData.iso || countryData.shortCode || '').toLowerCase().trim();
    if (directCode.length === 2 && !/^\d+$/.test(directCode)) {
        return directCode;
    }
    const countryId = String(countryData.countryId || countryData.id || '').trim();
    if (SMSBOWER_ID_TO_ISO[countryId]) {
        return SMSBOWER_ID_TO_ISO[countryId];
    }
    const cleanName = String(countryData.countryName || countryData.name || countryData.eng || countryData.country || '').toLowerCase().trim();
    if (COUNTRY_FLAG_MAP[cleanName]) {
        return COUNTRY_FLAG_MAP[cleanName];
    }
    const matchedKey = Object.keys(COUNTRY_FLAG_MAP)
        .sort((a, b) => b.length - a.length)
        .find(key => cleanName.includes(key));

    if (matchedKey) {
        return COUNTRY_FLAG_MAP[matchedKey];
    }

    // 5. Normal a fallback
    return (countryId.length === 2 && !/^\d+$/.test(countryId)) ? countryId.toLowerCase() : 'un';
}

// Clipboard API only exists on https/localhost; plain http (e.g. a phone on the LAN IP) needs the old textarea trick
function writeClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(area);
        area.select();
        area.setSelectionRange(0, text.length); // iOS needs an explicit range
        const ok = document.execCommand('copy');
        area.remove();
        ok ? resolve() : reject(new Error('execCommand copy failed'));
    });
}

window.copyText = function(text, btn) {
    writeClipboard(text).then(() => {
        // 1. Tick on the button itself
        const original = btn.innerHTML;
        btn.innerHTML = ICONS.check;
        btn.classList.add('text-green-600');
        setTimeout(() => { btn.innerHTML = original; btn.classList.remove('text-green-600'); }, 1500);

        // 2. Toast at the top so the copy is obvious on a phone
        Swal.fire({
            toast: true, position: 'top', icon: 'success',
            title: 'Copied', text: text,
            showConfirmButton: false, timer: 1800, timerProgressBar: true
        });
    }).catch(() => alert('Copy failed. Select the text and copy it manually.'));
};

/**
 * Searchable dropdown used for both steps.
 * options: { itemKey(item), renderItem(item), matches(item, term), emptyText, onSelect(item) }
 */
function createPicker(rootId, options) {
    const root = document.getElementById(rootId);
    const trigger = root.querySelector('[data-trigger]');
    const label = root.querySelector('[data-label]');
    const panel = root.querySelector('[data-panel]');
    const search = root.querySelector('[data-search]');
    const list = root.querySelector('[data-list]');
    let items = [];

    function renderList() {
        const term = search.value.trim().toLowerCase();
        const visible = items.filter(item => !term || options.matches(item, term)).slice(0, 300);
        list.innerHTML = visible.length
            ? visible.map(item => `
                <li>
                    <button type="button" data-key="${escapeHtml(options.itemKey(item))}" class="w-full flex items-center gap-3 px-4 py-3 text-left text-[15px] text-brand-darkText hover:bg-brand-background focus:bg-brand-background focus:outline-none transition-colors">
                        ${options.renderItem(item)}
                    </button>
                </li>`).join('')
            : `<li class="px-4 py-6 text-center text-xs text-brand-lightText">${options.emptyText}</li>`;
    }

    function open() {
        if (trigger.disabled) return;
        panel.classList.remove('hidden');
        search.value = '';
        renderList();
        setTimeout(() => search.focus(), 0);
    }

    function close() {
        panel.classList.add('hidden');
    }

    trigger.addEventListener('click', () => panel.classList.contains('hidden') ? open() : close());
    search.addEventListener('input', renderList);
    search.addEventListener('keydown', e => {
        if (e.key === 'Escape') close();
        if (e.key === 'Enter') list.querySelector('button')?.click();
    });
    list.addEventListener('click', e => {
        const btn = e.target.closest('button[data-key]');
        if (!btn) return;
        const item = items.find(i => String(options.itemKey(i)) === btn.dataset.key);
        if (item) options.onSelect(item);
        close();
    });
    document.addEventListener('click', e => { if (!root.contains(e.target)) close(); });

    return {
        setItems(newItems) { items = newItems || []; if (!panel.classList.contains('hidden')) renderList(); },
        setLabel(html) { label.innerHTML = html; },
        setDisabled(isDisabled) { trigger.disabled = isDisabled; if (isDisabled) close(); }
    };
}

async function fetchServices() {
    try {
        const { data } = await safeFetch(`${API_BASE_URL}/services`);

        if (!servicesList.length) {

        servicePicker.setLabel(`<span class="text-red-500">Couldn't load services. Refresh the page.</span>`);

window.selectServiceByCode = function(code) {
    const service = servicesList.find(s => s.code === code);
    if (service) selectService(service);

async function selectService(service) {
    selectedService = service;
    selectedCountry = null;
    renderPopularServices();
    servicePicker.setLabel(`${serviceImg(service.code, 'w-8 h-8')}<span class="truncate font-semibold text-brand-darkText">${escapeHtml(service.name)}</span>`);
    countryPicker.setDisabled(true);
    countryPicker.setLabel(`<span class="text-brand-lightText flex items-center gap-2">${ICONS.spinner} Loading countries and prices...</span>`);
    updateSummary();

    try {
        const cached = countriesCache[service.code];
        let countries = cached && Date.now() - cached.at < COUNTRIES_CACHE_MS ? cached.countries : null;
        if (!countries) {
            const { data } = await safeFetch(`${API_BASE_URL}/countries?service=${encodeURIComponent(service.code)}`);
            countries = data?.countries || [];
            countriesCache[service.code] = { at: Date.now(), countries };
        }
        if (selectedService?.code !== service.code) return; // The user picked another service meanwhile

        // Popular countries pinned on top (in POPULAR_COUNTRY_IDS order), the rest A to Z
        const popularRank = c => {
            const i = POPULAR_COUNTRY_IDS.indexOf(String(c.countryId));
            return i === -1 ? POPULAR_COUNTRY_IDS.length : i;
        };
        countries = [...countries].sort((a, b) => popularRank(a) - popularRank(b) || String(a.countryName).localeCompare(String(b.countryName)));
        countryPicker.setItems(countries);
        countryPicker.setDisabled(countries.length === 0);
        countryPicker.setLabel(countries.length
            ? `<span class="text-brand-lightText">Choose a country (${countries.length} available)</span>`
            : `<span class="text-red-500">No countries for this service right now.</span>`);
    } catch (err) {
        console.error("Failed to load countries:", err);
        countryPicker.setLabel(`<span class="text-red-500">Couldn't load countries. Pick the service again.</span>`);
    }
}

function selectCountry(country) {
    selectedCountry = country;
    // Price sits in the dropdown, right before the arrow (or "Out of stock")
    const priceTag = country.stock > 0
        ? `<span class="shrink-0 font-extrabold text-brand-darkText tabular-nums">${formatNaira(country.price?.amount)}</span>`

        customClass: DIALOG_CLASSES
    });
    if (!confirmResult.isConfirmed) return;
    if (!hasFunds) {
        window.location.href = '/fund-wallet';
        return;
    }

    // 2. Purchase (the server works out the price itself)
    const buyBtn = document.getElementById('buyBtn');
    buyBtn.disabled = true;
    buyBtn.innerText = 'Processing...';
    try {
        const { res, data } = await safeFetch(`${API_BASE_URL}/purchase-with-wallet`, {
            method: 'POST',
            body: JSON.stringify({
                serviceCode: selectedService.code,
                countryId: selectedCountry.countryId,
                metadata: {
                    serviceType: 'virtual_number',
                    serviceCode: selectedService.code,
                    serviceName: selectedService.name
                }
            })
        });

        if (res.status === 401) return logout();
        if (res.status === 403 && data.isUnverified) {
            window.location.href = `/register?verify_email=${encodeURIComponent(data.email || '')}`;
            return;
        }

        if (data.success && data.order) {
            activeOrders.unshift(data.order);
            renderActiveOrders();
            fetchUserProfile();
            delete countriesCache[selectedService.code]; // Stock changed
            if (isMobileView()) document.getElementById('activeOrdersList').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            // Small toast instead of a full dialog; the wallet is already refunded server-side
            Swal.fire({
                toast: true, position: 'top', icon: 'error',
                title: data.message || 'Could not get a number. Please try another country.',
                showConfirmButton: false, timer: 4000, timerProgressBar: true
            });
        }
    } catch (err) {
        console.error("Purchase Error:", err);
        Swal.fire({ icon: 'error', title: 'Network error', text: 'Check your connection and try again.' });
    } finally {
        buyBtn.innerText = 'Buy Number';
        updateSummary();
    }
}

function isMobileView() {
    return window.innerWidth < 1024; // Below lg the active numbers sit under the buy panel
}

document.getElementById('buyBtn').addEventListener('click', buySelectedNumber);

// --- 5. Active Numbers (Pending, Or Code Received In The Last 20 Minutes) ---
const SMS_ACTIVATION_WINDOW_MS = 20 * 60 * 1000; // One window from purchase: unused numbers are refunded, and "Request another code" stops, at the end of it
const DISMISSED_KEY = 'sms_dismissed_orders';
let activeOrders = [];

function getDismissedIds() {
    try { return JSON.parse(localStorage.getItem(DISMISSED_KEY) || '[]'); } catch (e) { return []; }
}

function orderAgeMs(order) {
    return Date.now() - new Date(order.createdAt).getTime();
}

function isOrderActive(order) {
    if (order.productType !== 'SmsNumber') return false;
    if (getDismissedIds().includes(order._id)) return false;
    if (order.status === 'pending') return true;
    return order.status === 'completed' && orderAgeMs(order) < SMS_ACTIVATION_WINDOW_MS;
}

function needsPolling(order) {
    return order.status === 'pending' || order.metadata?.awaitingNextCode === true;
}

/**
 * Loads the user's active numbers, then asks the server to check each waiting one with SMSBower
 */
async function fetchActiveOrders() {
    try {
        const { res, data } = await safeFetch(`${API_BASE_URL}/user-orders?limit=50`);
        if (res.status === 401) return logout();
        const orders = Array.isArray(data) ? data : (data.orders || []);
        activeOrders = orders.filter(isOrderActive);
        renderActiveOrders();
        pollActiveOrders();
    } catch (err) {
        console.error("Failed to load active numbers:", err);
        document.getElementById('activeOrdersList').innerHTML = `<p class="bg-white border border-brand-border rounded-2xl px-4 py-5 text-center text-xs text-red-500">Couldn't load your numbers. Tap Refresh.</p>`;
    }
}

let isPolling = false;
async function pollActiveOrders() {
    if (isPolling) return;
    const waiting = activeOrders.filter(needsPolling);
    if (!waiting.length) return;

    isPolling = true;
    const signatureBefore = ordersSignature();
    try {
        const updates = await Promise.all(waiting.map(order =>
            safeFetch(`${API_BASE_URL}/order-details?id=${encodeURIComponent(order._id)}`)
                .then(({ data }) => (data.success && data.order ? data.order : null))
                .catch(() => null)
        ));

        let balanceChanged = false;
        updates.filter(Boolean).forEach(updated => {
            const index = activeOrders.findIndex(o => o._id === updated._id);
            if (index === -1) return;
            if (updated.status === 'cancelled') balanceChanged = true; // Refunded automatically
            activeOrders[index] = updated;
        });
        activeOrders = activeOrders.filter(isOrderActive);
        // Redraw only when something changed, so a click isn't lost to a redraw mid-press
        if (ordersSignature() !== signatureBefore) renderActiveOrders();
        if (balanceChanged) fetchUserProfile();
    } finally {
        isPolling = false;
    }
}

function ordersSignature() {
    return JSON.stringify(activeOrders.map(o => [o._id, o.status, o.smsCode, o.metadata?.awaitingNextCode]));
}

function renderActiveOrders() {
    const container = document.getElementById('activeOrdersList');
    if (!activeOrders.length) {
        container.innerHTML = `
            <div class="bg-white border border-brand-border rounded-2xl px-4 py-8 text-center">
                <div class="w-12 h-12 mx-auto rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center">${ICONS.phone}</div>
                <p class="mt-3 text-sm font-bold text-brand-darkText">No active numbers</p>
                <p class="text-xs text-brand-lightText mt-1">Numbers you buy show here with their codes.</p>
            </div>`;
        return;
    }
    container.innerHTML = activeOrders.map(renderOrderCard).join('');
    updateCountdowns();
}

function renderOrderCard(order) {
    const meta = order.metadata || {};
    const serviceCode = meta.serviceCode || '';
    const serviceName = meta.serviceName || order.serviceName || serviceCode.toUpperCase() || 'SMS';
    const countryData = { countryId: meta.countryCode || order.country, countryName: meta.countryName };
    const countryName = meta.countryName || getCountryFlagCode(countryData).toUpperCase();
    const number = order.targetNumber || order.phoneNumber || '';
    const displayNumber = number ? `+${number.replace(/^\+/, '')}` : '—';
    const isPending = order.status === 'pending';
    const isWaitingAgain = meta.awaitingNextCode === true;
    const id = escapeHtml(order._id);

    const hasCode = order.smsCode && !isWaitingAgain;

    // 1. Status Pill (dot + short word, top right)
    const status = hasCode
        ? `<span class="flex items-center gap-1.5 text-[11px] font-semibold text-green-700 bg-green-50 rounded-full pl-2 pr-2.5 py-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>Received</span>`
        : `<span class="flex items-center gap-1.5 text-[11px] font-semibold text-brand-orange bg-orange-50 rounded-full pl-2 pr-2.5 py-1"><span class="w-1.5 h-1.5 rounded-full bg-brand-orange animate-pulse"></span>${isWaitingAgain ? 'New code' : 'Waiting'}</span>`;

    // 2. Number And Code Rows (same shape: small label, value, copy icon)
    const copyBtn = (value, title) => `<button onclick="copyText('${escapeHtml(value)}', this)" class="shrink-0 w-9 h-9 rounded-lg text-brand-lightText hover:text-brand-blue hover:bg-white flex items-center justify-center transition-colors" title="${title}">${ICONS.copy}</button>`;
    const row = (label, valueHtml, copyHtml) => `
        <div class="flex items-center gap-3 bg-brand-background rounded-xl pl-4 pr-2 py-2.5">
            <div class="flex-1 min-w-0">
                <p class="text-[10px] font-bold uppercase tracking-widest text-brand-lightText">${label}</p>
                ${valueHtml}
            </div>
            ${copyHtml}
        </div>`;

    const numberRow = row('Number',
        `<p class="font-mono text-lg font-bold text-brand-darkText tracking-wide truncate">${escapeHtml(displayNumber)}</p>`,
        number ? copyBtn(number.replace(/^\+/, ''), 'Copy number') : '');
    const codeRow = row('Code',
        hasCode
            ? `<p class="font-mono text-2xl font-black tracking-[0.25em] text-green-600 leading-tight">${escapeHtml(order.smsCode)}</p>`
            : `<p class="flex items-center gap-1 h-7 text-sm font-medium text-brand-lightText">${isWaitingAgain ? 'Waiting for the new code' : 'Waiting for SMS'}<span class="inline-flex gap-0.5 ml-1"><span class="w-1 h-1 rounded-full bg-brand-lightText animate-bounce"></span><span class="w-1 h-1 rounded-full bg-brand-lightText animate-bounce [animation-delay:150ms]"></span><span class="w-1 h-1 rounded-full bg-brand-lightText animate-bounce [animation-delay:300ms]"></span></span></p>`,
        hasCode ? copyBtn(order.smsCode, 'Copy code') : '');

    const previousCodes = (meta.previousCodes || []).filter(Boolean);

    // 3. Footer Actions (light text buttons)
    const actions = isPending
        ? `<button onclick="cancelActiveOrder('${id}')" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold text-red-600 hover:bg-red-50 transition-colors">
               ${ICONS.cancel}<span>Cancel &amp; refund</span>
           </button>`
        : `${!isWaitingAgain && meta.canGetAnotherSms !== false
                ? `<button onclick="requestAnotherCode('${id}', this)" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold text-brand-blue hover:bg-brand-blue/10 transition-colors">
                       ${ICONS.refresh} Another code
                   </button>` : ''}
           <button onclick="dismissOrder('${id}')" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold text-brand-midText hover:bg-brand-background transition-colors">
               ${ICONS.check.replace('w-4 h-4', 'w-3.5 h-3.5')} Done
           </button>`;

    // Same deadline before and after the code arrives, so the countdown carries on instead of restarting
    const deadline = new Date(order.createdAt).getTime() + SMS_ACTIVATION_WINDOW_MS;

    return `
        <div class="bg-white border border-brand-border rounded-2xl overflow-hidden">
            <div class="p-4 space-y-3">
                <div class="flex items-center gap-3">
                    ${serviceImg(serviceCode, 'w-10 h-10')}
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-brand-darkText truncate">${escapeHtml(serviceName)}</p>
                        <p class="text-xs text-brand-lightText flex items-center gap-1.5 truncate">${flagImg(countryData, 'w-4 h-3')} ${escapeHtml(countryName)}</p>
                    </div>
                    ${status}
                </div>
                ${numberRow}
                ${codeRow}
                ${previousCodes.length ? `<p class="text-[11px] text-brand-lightText px-1">Earlier code${previousCodes.length > 1 ? 's' : ''}: <span class="font-mono">${previousCodes.map(escapeHtml).join(', ')}</span></p>` : ''}
            </div>
            <div class="border-t border-brand-border px-4 py-2 flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs text-brand-lightText flex items-center gap-1.5">
                    ${ICONS.clock}
                    <span>${isPending ? 'Refund in' : 'Open for'}</span>
                    <span class="order-countdown font-mono font-semibold text-brand-darkText" data-deadline="${deadline}">--:--</span>
                </span>
                <div class="flex flex-wrap gap-1">${actions}</div>
            </div>
        </div>`;
}

// Ticks the countdowns (Cancel works straight away: the server refunds even inside SMSBower's 2-minute wait)
function updateCountdowns() {
    document.querySelectorAll('.order-countdown').forEach(el => {
        el.textContent = formatCountdown(Number(el.dataset.deadline) - Date.now());
    });
}

window.requestAnotherCode = async function(orderId, btn) {
    btn.disabled = true;
    btn.innerHTML = 'Processing...';
    try {
        const { res, data } = await safeFetch(`${API_BASE_URL}/request-another-code`, {
            method: 'POST',
            body: JSON.stringify({ id: orderId })
        });
        if (res.status === 401) return logout();

        if (data.success && data.order) {
            const index = activeOrders.findIndex(o => o._id === orderId);
            if (index !== -1) activeOrders[index] = data.order;
            renderActiveOrders();
            Swal.fire({ icon: 'info', title: 'Ready for another code', text: data.message, timer: 3000, showConfirmButton: false });
        } else {
            Swal.fire({ icon: 'error', title: 'Request failed', text: data.message || 'Could not request another code.' });
            renderActiveOrders();
        }
    } catch (err) {
        console.error("Request another code error:", err);
        Swal.fire({ icon: 'error', title: 'Network error', text: 'Check your connection and try again.' });
        renderActiveOrders();
    }
};

window.dismissOrder = function(orderId) {
    const dismissed = getDismissedIds().concat(orderId).slice(-100);
    localStorage.setItem(DISMISSED_KEY, JSON.stringify(dismissed));
    activeOrders = activeOrders.filter(o => o._id !== orderId);
    renderActiveOrders();
};

// --- 6. Startup ---
document.addEventListener('DOMContentLoaded', () => {
    userBalance = parseFloat(localStorage.getItem('user_balance')) || 0; // Instant header balance from the last visit
    renderHeaderBalance();
    fetchUserProfile();
    fetchServices();
    fetchActiveOrders();

    setInterval(updateCountdowns, 1000);
    setInterval(() => {
        if (document.hidden) return;
        const countBefore = activeOrders.length;
        activeOrders = activeOrders.filter(isOrderActive); // Drops numbers whose window has closed
        if (activeOrders.some(needsPolling)) pollActiveOrders();
        else if (activeOrders.length !== countBefore) renderActiveOrders();
    }, 5000);
});
  </script>
</body>
