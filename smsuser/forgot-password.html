<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DeemaxHub</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="/assets/dark.css?v=16">
    <script src="/assets/theme.js?v=12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0F54C6', orange: '#F9861E', red: '#E31E24', darkText: '#101828',
                            midText: '#344054', lightText: '#667085', background: '#F0F5FE', border: '#EAECF0',
                        }
                    },
                    fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* 1. AUTH CARD (Bare on phones so the form gets the full width; a card from tablet up) */
        @media (min-width: 768px) {
            .auth-card {
                background-color: #FFFFFF;
                border: 1px solid #EAECF0;
                border-radius: 28px;
                padding: 44px;
                box-shadow: 0 20px 25px -5px rgba(23, 37, 84, 0.05), 0 8px 10px -6px rgba(23, 37, 84, 0.05);
            }
            html.dark .auth-card { background-color: #0A0A0A; border-color: #1F1F1F; box-shadow: none; }
        }

        /* 2. INPUTS (Filled boxes; 16px text stops phones zooming in on focus) */
        .auth-input { font-size: 16px; background-color: #F7F9FD; }
        .auth-input:focus { background-color: #FFFFFF; }
        html.dark .auth-input { background-color: #111111; }
        html.dark .auth-input:focus { background-color: #0A0A0A; }
        @media (min-width: 768px) { .auth-input { font-size: 15px; } }

        /* 3. PRIMARY BUTTON (Brand blue into indigo, with a soft glow) */
        .auth-primary {
            background-image: linear-gradient(90deg, #0F54C6 0%, #4F46E5 100%);
            box-shadow: 0 12px 28px -10px rgba(15, 84, 198, 0.6);
        }
        .auth-primary:hover { filter: brightness(1.08); }
    </style>
</head>
<body class="bg-brand-background min-h-screen flex flex-col font-sans border-t-2 border-t-brand-red selection:bg-brand-blue selection:text-white">

    <!-- Top Bar (logo on the left, Login / Sign Up switch on the right) -->
    <nav class="px-4 md:px-8 pt-5 md:pt-6 flex items-center justify-between gap-3">
        <a href="/dashboard" class="inline-flex">
            <img src="/assets/logo.png" alt="DeemaxHub" class="h-8 md:h-9 w-auto object-contain">
        </a>
        <div class="flex items-center gap-2 md:gap-3">
            <a href="/login" class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl border border-brand-border text-sm md:text-[15px] font-semibold text-brand-midText hover:border-brand-blue hover:text-brand-blue transition-colors">Login</a>
            <a href="/register" class="auth-primary px-4 md:px-5 py-2 md:py-2.5 rounded-xl text-sm md:text-[15px] font-bold text-white transition">Sign Up</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-8 md:py-12">
        <div class="w-full max-w-[440px]">

            <div class="auth-card">

                <!-- Step 1: Ask for the email -->
                <div id="requestView">
                    <div class="mb-8">
                        <p class="flex items-center gap-2 text-sm font-medium text-brand-blue">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                            Forgot password
                        </p>
                        <h1 class="text-[28px] md:text-[32px] font-extrabold text-brand-darkText tracking-tight leading-tight mt-2">Reset your <span class="text-brand-blue">password</span></h1>
                        <p class="text-[15px] text-brand-lightText mt-1.5">Enter the email you signed up with and we'll send you a reset link.</p>
                    </div>

                    <!-- Inline Error (replaces browser alerts) -->
                    <div id="formError" class="hidden mb-5 flex items-start gap-2.5 px-4 py-3 rounded-xl bg-red-50 border border-red-100 text-red-600 text-[13px] font-medium leading-snug" role="alert">
                        <svg class="w-4 h-4 mt-px shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="formErrorText"></span>
                    </div>

                    <form id="forgotForm" class="space-y-5" novalidate>
                        <div>
                            <label for="email" class="block text-sm font-medium text-brand-midText mb-2">Email</label>
                            <input type="email" id="email" name="email" required autocomplete="email"
                                class="auth-input w-full h-[52px] px-4 rounded-xl border border-brand-border text-brand-darkText focus:ring-4 focus:ring-blue-100 focus:border-brand-blue outline-none transition-all placeholder:text-gray-400"
                                placeholder="you@example.com">
                        </div>

                        <button type="submit" id="submitBtn" class="auth-primary w-full h-[52px] text-white rounded-xl text-base font-bold transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                            Send reset link
                        </button>
                    </form>
                </div>

                <!-- Step 2: Link sent -->
                <div id="sentView" class="hidden">
                    <div class="mb-8">
                        <p class="flex items-center gap-2 text-sm font-medium text-green-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Link sent
                        </p>
                        <h1 class="text-[28px] md:text-[32px] font-extrabold text-brand-darkText tracking-tight leading-tight mt-2">Check your <span class="text-brand-blue">inbox</span></h1>
                        <p id="sentMessage" class="text-[15px] text-brand-lightText mt-1.5 break-words"></p>
                    </div>

                    <a href="/login" class="auth-primary w-full h-[52px] flex items-center justify-center text-white rounded-xl text-base font-bold transition-all active:scale-[0.98]">
                        Back to sign in
                    </a>
                    <p class="text-center mt-5 text-sm text-brand-lightText">
                        Didn't get it? Check your spam folder or
                        <button type="button" id="tryAgainBtn" class="text-brand-blue font-semibold hover:underline">try again</button>.
                    </p>
                </div>

                <p id="footerText" class="text-center mt-8 text-[15px] text-brand-lightText">
                    Remembered it?
                    <a href="/login" class="text-brand-blue font-semibold hover:underline">Sign in</a>
                </p>
            </div>

            <!-- Footer Links -->
            <nav class="flex justify-center gap-5 mt-8 text-xs text-brand-lightText">
                <a href="/terms" class="hover:text-brand-blue transition-colors">Terms</a>
                <a href="/privacy" class="hover:text-brand-blue transition-colors">Privacy</a>
                <a href="/support" class="hover:text-brand-blue transition-colors">Support</a>
            </nav>
        </div>
    </main>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const formError = document.getElementById('formError');
        const formErrorText = document.getElementById('formErrorText');

        // Shows a message above the form instead of a browser pop-up
        function showError(message) {
            formErrorText.textContent = message;
            formError.classList.remove('hidden');
        }

        // --- 1. Swap Between the Request and "Link Sent" Steps ---
        function showStep(step) {
            document.getElementById('requestView').classList.toggle('hidden', step !== 'request');
            document.getElementById('sentView').classList.toggle('hidden', step !== 'sent');
            document.getElementById('footerText').classList.toggle('hidden', step !== 'request');
        }

        document.getElementById('tryAgainBtn').addEventListener('click', () => {
            showStep('request');
            document.getElementById('email').focus();
        });

        // --- 2. Send Reset Link ---
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formError.classList.add('hidden');
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showError("Enter your email address.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending link...";

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('sentMessage').textContent =
                        data.message || "Please check your email for instructions.";
                    showStep('sent');
                } else {
                    showError(data.message || "Failed to send reset link.");
                }
            } catch (err) {
                showError("Network error. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send reset link";
            }
        });
    </script>
</body>
</html>
